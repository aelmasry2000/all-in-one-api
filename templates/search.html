<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Search Catalog Records</title>
    <style>
        body { font-family: Arial; background-color: #f8f9fa; text-align: center; }
        form { background: white; padding: 20px; border-radius: 8px; display: inline-block; width: 80%; max-width: 800px; }
        .result { background: #fff; padding: 10px; margin-top: 10px; border: 1px solid #ddd; text-align: left; }
    </style>
</head>
<body>
    <h1>Search Catalog Records</h1>
    <form method="POST">
        <input type="text" name="query" value="{{ query }}" placeholder="Enter your search query..." style="width: 80%; padding: 10px;">
        <br><br>
        <button type="submit">Search</button>
    </form>

    {% if results %}
        <h2>Results ({{ results|length }})</h2>
        {% for r in results %}
            <div class="result">
                <strong>Filename:</strong> {{ r.filename }}<br>
                <strong>Extracted Text:</strong> {{ r.extracted_text[:200] }}...<br>
                <pre>{{ r.json_styles }}</pre>
                <pre>{{ r.marc_styles }}</pre>
            </div>
        {% endfor %}
    {% elif query %}
        <p>No results found for "{{ query }}"</p>
    {% endif %}

</body>
</html>
